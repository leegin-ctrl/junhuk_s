:root{--bg:#e6e8ee;--fg:#333;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:417px;height:910px;flex:none;transform-origin:center;display:flex;flex-direction:column;align-items:center}
.hint{font-size:13px;margin-top:12px;opacity:.7;text-align:center}

.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:50}
#sb{position:absolute;top:0;left:0;right:0;height:54px;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:600;font-size:16px;pointer-events:none}

.view{position:absolute;inset:0;display:none;flex-direction:column;padding-top:54px;box-sizing:border-box}
.view.on{display:flex}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:6px;border-radius:3px;background:#111;z-index:60;cursor:pointer;opacity:.85}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 0;padding:14px 18px 0;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;color:#222;cursor:pointer;width:70px}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.dock{margin:auto 14px 24px;height:92px;border-radius:34px;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);display:flex;justify-content:space-evenly;align-items:center}
.dock .app span{display:none}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;font-size:13px;padding:8px 14px;border-radius:16px;z-index:70;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#noti{position:absolute;top:54px;left:10px;right:10px;z-index:71;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:24px;background:rgba(248,248,250,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 8px 28px rgba(0,0,0,.25);color:#111;transform:translateY(-140%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.1),opacity .3s;cursor:pointer;pointer-events:none}
#noti.on{transform:none;opacity:1;pointer-events:auto}
#noti .nic{width:38px;height:38px;border-radius:9px;background:#fee500;display:flex;align-items:center;justify-content:center;flex:none}
#noti .nt{flex:1;min-width:0}
#noti .nr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#noti .nr b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#noti .nr small{font-size:12px;color:#7a7a80;flex:none}
#nb{font-size:14px;line-height:1.3;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;color:#222}
.bd{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
.pill{align-self:center;margin-top:20px;background:rgba(60,60,60,.35);color:#fff;font-size:12px;padding:6px 14px;border-radius:16px;backdrop-filter:blur(8px)}
/* kakao */
.khead{padding:10px 20px 8px;font-size:22px;font-weight:700}
.row{display:flex;gap:12px;padding:10px 20px;align-items:center;cursor:pointer}
.row:active{background:#f1f1f1}
.av{width:46px;height:46px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.rt{flex:1;min-width:0}.rt b{font-size:15px}.rt p{margin:3px 0 0;font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{margin-top:auto;height:84px;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;padding-top:8px;font-size:11px;color:#999;background:#fff}
.tabs div{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px}.tabs div i{font-style:normal;font-size:22px}.tabs .sel{color:#111}
#chat{background:#b2c7d9}
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;font-weight:700;font-size:17px}
.chead button{border:0;background:none;font-size:22px;cursor:pointer;padding:0 6px}
#msgs{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.m{display:flex;gap:6px;align-items:flex-end;max-width:100%}.m.me{flex-direction:row-reverse}
.b{padding:8px 12px;border-radius:14px;background:#fff;font-size:14.5px;line-height:1.35;max-width:220px;word-break:break-word}
.me .b{background:#fee500}
.tm{font-size:10px;color:#556}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;background:#999;border-radius:50%;animation:d 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes d{50%{opacity:.2}}
.inp{display:flex;gap:8px;padding:8px 12px 30px;background:#fff}
.inp input{flex:1;border:1px solid #ddd;border-radius:18px;padding:9px 14px;font-size:15px;outline:none}
.inp button{border:0;border-radius:18px;background:#fee500;font-weight:700;padding:0 16px;cursor:pointer}
/* kakao v2 */
#kakao{background:#fff}
.sbi{display:flex;align-items:center;gap:6px}
.kh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 4px}
.kh h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.5px}
.ic2{display:flex;gap:16px}
.ic2 svg{width:25px;height:25px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.chips{display:flex;gap:7px;padding:10px 16px 4px;overflow:hidden}
.chip{height:38px;box-sizing:border-box;border:1px solid #e3e3e6;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 13px;font-size:14px;font-weight:600;color:#222;flex:none;background:#fff}
.chip.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.obg{min-width:20px;height:20px;box-sizing:border-box;border-radius:10px;background:#e8643a;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.ad{margin:10px 16px 4px;background:#f4f4f6;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;height:72px;box-sizing:border-box;flex:none}
.ad small{font-size:10px;color:#777;display:flex;align-items:center;gap:4px}
.ad small i{background:#3c1e1e;color:#fee500;font-style:normal;font-size:7px;font-weight:700;padding:1px 3px;border-radius:3px}
.ad b{display:block;font-size:14px;margin:3px 0 2px;letter-spacing:-.3px}
.ad p{margin:0;font-size:12px;color:#777}

const hist={},unread={};CONTACTS.forEach(c=>{

let cur=null,prev='home',timers=[],pn='';
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function tick(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,20000);
function show(id){
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));
 const l=id==='call';$('#sb').className=l?'light':'dark';$('#homebar').className=l?'light':'';
 if(id!=='call')prev=id;

let notiT=0,notiC=null;
function notify(c,t){
 notiC=c;$('#nn').textContent=c.name;$('#nb').textContent=t;
 const e=$('#noti');e.classList.add('on');clearTimeout(notiT);notiT=setTimeout(()=>e.classList.remove('on'),3500);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}

const DOCK=[
['전화',G,S('<path d="M6.600 10.800a15 15 0 006.600 6.600l2.200-2.200a1 1 0 011-.25 11 11 0 003.500.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.500a1 1 0 011 1 11 11 0 00.6 3.500 1 1 0 01-.25 1z" fill="#fff"/>'),0,'phone'],

function mk(a){const d=document.createElement('div');d.className='app';
 d.innerHTML=`<div class="ic" style="background:${a[1]}">${a[2]}${a[3]?`<b class="bd"${a[4]==='kakao'?' id="homeB"':''}>${a[3]}</b>`:''}</div><span>${a[0]}</span>`;
 d.onclick=()=>{if(a[4]==='contacts'){open('phone');tab(2)}else if(a[4])open(a[4]);else toast('데모에서는 지원하지 않는 앱이에요')};return d}
GRID.forEach(a=>$('#grid').append(mk(a)));
DOCK.forEach(a=>$('#dock').append(mk(a)));
function open(id){if(id==='kakao')renderList();if(id==='phone')tab(1);show(id)}

/* kakao */
function badges(){const n=Object.values(unread).reduce((a,b)=>a+b,0);['#tabB','#chipB','#homeB'].forEach(s=>{const e=$(s);if(!e)return;e.textContent=n;e.style.display=n?(s==='#homeB'?'flex':'inline-flex'):'none'})}
function renderList(){
 $('#klist').innerHTML='';
 CONTACTS.slice().sort((a,b)=>(b.arrivedAt||0)-(a.arrivedAt||0)).forEach(c=>{const h=hist[c.id],last=h[h.length-1],u=unread[c.id];if(!h.length)return;
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<div class="av" style="background:${c.color}">${c.emoji}</div><div class="rt"><b>${c.name}</b><p>${last.t}</p></div><div class="rm"><small>${last.tm}</small>${u?`<span class="obg">${u}</span>`:''}</div>`;
  r.onclick=()=>openChat(c);$('#klist').append(r)});
 badges();
}
function openChat(c){cur=c;unread[c.id]=0;$('#ctitle').textContent=c.name;$('#ti').value='';$('#pill').classList.remove('has');ghost();renderMsgs();show('chat');setTimeout(()=>$('#ti').focus(),50)}
function renderMsgs(){
 const box=$('#msgs'),L=hist[cur.id];box.innerHTML='';
 L.forEach((m,i)=>{const d=document.createElement('div');d.className='msg'+(m.me?' me':'');
  const first=!i||L[i-1].me!==m.me;
  const unr=m.me&&!L.slice(i+1).some(x=>!x.me);
  const meta=`<div class="meta">${unr?'<span class="rd">1</span>':''}<span>${m.tm}</span></div>`;
  const b=`<div class="bub${first?' first':''}">${m.t}</div>`;
  d.innerHTML=m.me?meta+b:b+meta;box.append(d)});
 box.scrollTop=box.scrollHeight;
}
function kt(){const d=new Date(),h=d.getHours();return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
/* 메시지 1개 도착: 채팅방을 보고 있으면 바로 표시, 아니면 안 읽음 +1 과 상단 카톡 알림 */
function arrive(c,m){
 hist[c.id].push({me:0,t:m.t,tm:m.tm});
 if(cur===c&&$('#chat').classList.contains('on')){renderMsgs();ghost()}
 else{unread[c.id]++;badges();if($('#kakao').classList.contains('on'))renderList();notify(c,m.t)}
}
function deliver(c){
 const L=c.incoming||[{t:c.first,tm:kt()}];
 hist[c.id]=[];unread[c.id]=0;c.arrivedAt=Date.now();
 if(c.script)c.wait=true;
 L.forEach((m,i)=>{
  setTimeout(()=>{
   if(c.script&&i===L.length-1)c.wait=false;
   arrive(c,m);
  },i*1500);
  if(m.also){const x=CONTACTS.find(z=>z.id===m.also.to);if(x)setTimeout(()=>arrive(x,m.also),i*1500+(m.also.delay||800))}
 });
}
function nextLines(c){const a=[];while(c.pos<c.script.length&&!c.script[c.pos].me)a.push(c.script[c.pos++]);return a}
/* 입력칸에 연한 회색으로 '다음에 칠 문장'을 보여줌 */
function ghost(){
 const g=$('#ghi'),ti=$('#ti');let t='';
 if(cur&&cur.script&&!cur.wait&&cur.pos<cur.script.length&&cur.script[cur.pos].me)t=cur.script[cur.pos].t.replace(/\n/g,' ');
 ti.placeholder=t?'':'메시지 입력';
 const v=ti.value;
 g.innerHTML=t?'<i>'+esc(v)+'</i>'+esc(t.slice(v.length)):'';
 g.style.transform='translateX('+(-ti.scrollLeft)+'px)';
}
function send(){
 const ti=$('#ti'),v=ti.value.trim();if(!v||!cur||cur.wait)return;
 ti.value='';$('#pill').classList.remove('has');
 const c=cur;let myText=esc(v),tm=c.script?kt():now(),rep=[];
 if(c.script){
  if(c.pos<c.script.length&&c.script[c.pos].me){const m=c.script[c.pos++];myText=m.t;tm=m.tm;rep=nextLines(c)}
 }else{
  let r=c.fallback;for(const k in c.replies){if(v.includes(k)){r=c.replies[k];break}}
  rep=[{me:0,t:r,tm:now()}];
 }
 hist[c.id].push({me:1,t:myText,tm});renderMsgs();
 if(rep.length)c.wait=true;
 ghost();
 let acc=0;
 rep.forEach((r,i)=>{
  const d0=acc,len=r.delay||1300;acc+=len;
  const dots=document.createElement('div');dots.className='msg';dots.innerHTML='<div class="bub dots"><span></span><span></span><span></span></div>';
  setTimeout(()=>{if(cur===c){$('#msgs').append(dots);$('#msgs').scrollTop=1e5}},d0+300);
  setTimeout(()=>{
   hist[c.id].push(r);
   if(i===rep.length-1)c.wait=false;
   if(r.fire){const x=CONTACTS.find(z=>z.id===r.fire);if(x&&!x.arrivedAt)setTimeout(()=>deliver(x),x.arrive.delay)}
   if(cur===c&&$('#chat').classList.contains('on')){renderMsgs();ghost()}
   else{unread[c.id]++;badges();if($('#kakao').classList.contains('on'))renderList();notify(c,r.t)}
  },d0+len);
 });
}
$('#ti').oninput=()=>{$('#pill').classList.toggle('has',!!$('#ti').value.trim());ghost()};
['keyup','scroll','click'].forEach(e=>$('#ti').addEventListener(e,ghost));
$('#noti').onclick=()=>{if(!notiC)return;clearTimeout(notiT);$('#noti').classList.remove('on');if($('#call').classList.contains('on'))endCall();openChat(notiC)};
$('#send').onclick=send;$('#ti').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
$('#back').onclick=()=>{cur=null;renderList();show('kakao')};

/* phone */
const KEYS=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
KEYS.forEach(k=>{const d=document.createElement('div');d.className='k';d.innerHTML=k[0]+(k[1]?`<small>${k[1]}</small>`:'');d.onclick=()=>{if(pn.length<13){pn+=k[0];upd()}};$('#keys').append(d)});
function fmt(s){return s.length>7?s.replace(/^(\d{3})(\d{4})(\d*)$/,'$1-$2-$3'):s.length>3?s.replace(/^(\d{3})(\d*)$/,'$1-$2'):s}
function upd(){$('#num').textContent=fmt(pn);$('#bs').style.visibility=pn?'visible':'hidden'}
$('#bs').onclick=()=>{pn=pn.slice(0,-1);upd()};
$('#dial').onclick=()=>{if(!pn)return;const c=CONTACTS.find(c=>c.num===pn);startCall(c||{name:fmt(pn),emoji:'❓',color:'#555',call:UNKNOWN})};
function tab(n){$('#keypad').style.display=n===1?'flex':'none';$('#clist').style.display=n===2?'block':'none';$('#t1').className=n===1?'sel':'';$('#t2').className=n===2?'sel':''}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
CONTACTS.forEach(c=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="av" style="background:${c.color}">${c.emoji}</div><div class="rt"><b>${c.name}</b><p>${fmt(c.num)}</p></div><span>📞</span>`;r.onclick=()=>startCall(c);$('#clist').append(r)});

/* call */
function startCall(c){
 endCall();$('#cav').textContent=c.emoji;$('#cav').style.background=c.color;$('#cn').textContent=c.name;$('#cs').textContent='연결 중...';$('#cap').innerHTML='';show('call');
 let sec=0;const T=(f,ms)=>timers.push(setTimeout(f,ms));
 T(()=>{$('#cs').textContent='00:00';window._ct=setInterval(()=>{sec++;$('#cs').textContent='0'+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},1000)},1800);
 c.call.forEach((t,i)=>T(()=>{const d=document.createElement('div');d.className='line';d.textContent=c.name+': '+t;$('#cap').append(d);$('#cap').scrollTop=1e5},2200+i*2800));
 T(()=>{$('#cs').textContent='통화 종료';clearInterval(window._ct)},2200+c.call.length*2800+400);
 T(()=>{hangup()},2200+c.call.length*2800+1800);
}
function hangup(){endCall();pn='';upd();show('phone')}
$('#end').onclick=()=>{endCall();$('#cs').textContent='통화 종료';setTimeout(hangup,500)};
$('#homebar').onclick=()=>{if($('#call').classList.contains('on'))endCall();show('home')};

badges();
/* fit */
function fit(){const s=Math.min(1,(innerHeight-16)/910,(innerWidth-16)/417);$('#stage').style.transform='scale('+s+')'}
fit();addEventListener('resize',fit);
</script></body></html>
